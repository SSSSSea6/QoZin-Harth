name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harth
          POSTGRES_PASSWORD: harth_dev
          POSTGRES_DB: harth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U harth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test
        env:
          HARTH_TEST_DATABASE_URL: postgres://harth:harth_dev@localhost:5433/harth_test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harth
          POSTGRES_PASSWORD: harth_dev
          POSTGRES_DB: harth_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U harth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @qozin/harth-sdk build

      - run: pnpm e2e
        env:
          HARTH_TEST_DATABASE_URL: postgres://harth:harth_dev@localhost:5434/harth_e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: |
          {
            echo POSTGRES_PASSWORD=ci-postgres-password
            echo BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef
            echo SITE_URL=http://localhost
            echo TOOLS_URL=http://tools.localhost
          } > .env

      - run: docker compose up -d --build --wait --wait-timeout 600

      - run: |
          curl -fsS http://localhost/health
          curl -fsS http://localhost/ | grep -q 火塘
          curl -fsS -o /dev/null http://localhost/logo.png
          curl -fsS -o /dev/null http://localhost/wordmark.svg
          curl -fsS http://localhost/privacy | grep -q 手机号
          curl -fsS -H "Host: tools.localhost" http://localhost/_harth/sdk.js | grep -q harth

      - run: |
          curl -fsS -X POST http://localhost/api/auth/sign-up/email -H "Content-Type: application/json" -H "Origin: http://localhost" -d '{"name":"冒烟","email":"smoke@example.com","password":"smoke-password"}' | grep -q '"user"'

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: harth-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: harth-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - run: |
          docker pull postgres:17-alpine
          docker pull caddy:2-alpine
          mkdir -p out
          docker save harth-api:${{ github.sha }} | gzip -1 > out/api.tar.gz
          docker save harth-web:${{ github.sha }} | gzip -1 > out/web.tar.gz
          docker save postgres:17-alpine | gzip -1 > out/postgres.tar.gz
          docker save caddy:2-alpine | gzip -1 > out/caddy.tar.gz
          printf '%s' "${{ github.sha }}" > out/sha
          ls -la out

      - run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar xz
          for f in api.tar.gz web.tar.gz postgres.tar.gz caddy.tar.gz; do
            ./aliyun oss cp "out/$f" "oss://harth-images/${{ github.sha }}/$f" -f -e oss-cn-hangzhou.aliyuncs.com --region cn-hangzhou
          done
          ./aliyun oss cp out/sha oss://harth-images/latest -f -e oss-cn-hangzhou.aliyuncs.com --region cn-hangzhou
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
